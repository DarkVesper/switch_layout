[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-layout-cli"
version = "1.0.0"
description = "CLI-утилита для исправления раскладки текста из буфера обмена"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "SQLAlchemy>=2.0,<3",
    "pyperclip>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
switch_layout = "switch_layout.cli:cli"

[tool.setuptools.packages.find]
include = ["switch_layout*"]
